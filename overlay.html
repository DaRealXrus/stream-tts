<!DOCTYPE html>
<html>
<head>
    <style>
        /* Using a clean, standard sans-serif font */
        body { 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            background: transparent; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center; /* Centers horizontally */
            align-items: center;     /* Centers vertically */
            text-align: center;
        }

        #container {
            opacity: 0; /* Hidden by default */
            transition: opacity 0.5s ease-in-out; /* Smooth fade in/out */
            padding: 20px;
            /* Small shadow instead of outline */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        /* "(Name) sent tts" styling */
        .header-text { 
            font-size: 24px; 
            font-weight: 800; 
            color: white; 
            margin-bottom: 5px;
        }

        /* The Blue Username */
        .username { 
            color: #3498db; /* Nice Blue */
        }

        /* The Message styling - slightly smaller */
        .message-text { 
            color: white; 
            font-size: 20px; 
            font-weight: 500;
            max-width: 600px; /* Keeps text from stretching too wide */
            word-wrap: break-word;
        }

        /* Show class to trigger fade in */
        .show {
            opacity: 1 !important;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="header" class="header-text"></div>
        <div id="message" class="message-text"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const streamerName = params.get('user')?.toLowerCase();
        
        const container = document.getElementById('container');
        const header = document.getElementById('header');
        const messageDiv = document.getElementById('message');

        let hideTimer; // Variable to store the 7-second countdown

        if (streamerName) {
            socket.emit('join', streamerName);
        }

        socket.on('play-tts', (data) => {
            // 1. Clear any existing timer so it doesn't fade out early
            clearTimeout(hideTimer);

            // 2. Set the text
            header.innerHTML = `<span class="username">${data.username}</span> sent tts`;
            messageDiv.innerText = data.message;

            // 3. Show the container
            container.classList.add('show');

            // 4. Play Brian TTS
            const brianUrl = `https://api.streamelements.com/kappa/v2/speech?voice=Brian&text=${encodeURIComponent(data.message)}`;
            const audio = new Audio(brianUrl);
            
            // Try to play audio, but don't crash if it fails
            audio.play().catch(e => console.log("Audio play blocked or failed"));

            // 5. FORCE fade out after 7 seconds
            hideTimer = setTimeout(() => {
                container.classList.remove('show');
            }, 7000);
        });
    </script>
</body>
</html>
