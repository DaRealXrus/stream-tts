<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; background: transparent; 
            font-family: 'Segoe UI', Roboto, sans-serif;
            height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center;
        }
        #container {
            opacity: 0; transition: opacity 0.6s ease-in-out;
            padding: 20px;
            /* Small soft shadow */
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }
        .header-text { 
            font-size: 18px; /* Smaller header */
            font-weight: 800; color: white; margin-bottom: 2px;
        }
        .username { color: #3498db; } /* Blue Username */
        
        .message-text { 
            color: white; font-size: 15px; /* Message text is smaller */
            font-weight: 500; max-width: 450px; margin: 0 auto;
        }
        .show { opacity: 1 !important; }
    </style>
</head>
<body>
    <div id="container">
        <div id="header" class="header-text"></div>
        <div id="message" class="message-text"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const streamerName = params.get('user')?.toLowerCase() || "ranwolfyt";
        
        const container = document.getElementById('container');
        const header = document.getElementById('header');
        const messageDiv = document.getElementById('message');

        let queue = [];
        let isPlaying = false;

        if (streamerName) socket.emit('join', streamerName);

        socket.on('play-tts', (data) => {
            queue.push(data);
            processQueue();
        });

        async function processQueue() {
            if (isPlaying || queue.length === 0) return;
            isPlaying = true;

            const current = queue.shift();
            header.innerHTML = `<span class="username">${current.username}</span> sent tts`;
            messageDiv.innerText = current.message;
            container.classList.add('show');

            const brianUrl = `https://api.streamelements.com/kappa/v2/speech?voice=Brian&text=${encodeURIComponent(current.message)}`;
            const audio = new Audio(brianUrl);

            // FAILSAFE: If audio fails or takes too long, we still move on
            const audioPromise = new Promise((resolve) => {
                audio.onended = resolve;
                audio.onerror = resolve; // Continue if the API blocks the word
                audio.play().catch(resolve); 
            });

            // Wait 7 seconds OR until audio finishes (whichever is slower ensures the alert stays up)
            const waitTimer = new Promise(res => setTimeout(res, 7000));
            await Promise.race([audioPromise, waitTimer]); 

            // Fade out
            container.classList.remove('show');

            setTimeout(() => {
                isPlaying = false;
                processQueue();
            }, 1000); // 1s gap between alerts
        }
    </script>
</body>
</html>
