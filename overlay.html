<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; background: transparent; 
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center;
        }
        #container {
            opacity: 0; transition: opacity 0.5s ease-in-out;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7); /* Small shadow */
        }
        .header { font-size: 22px; font-weight: 800; color: white; margin-bottom: 2px; }
        .user { color: #3498db; } /* Blue Username */
        .msg { font-size: 18px; color: white; font-weight: 500; max-width: 500px; }
        .show { opacity: 1 !important; }
    </style>
</head>
<body>
    <div id="container">
        <div id="header" class="header"></div>
        <div id="message" class="msg"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const streamer = params.get('user')?.toLowerCase() || "ranwolfyt";
        
        const container = document.getElementById('container');
        const header = document.getElementById('header');
        const messageDiv = document.getElementById('message');

        let queue = [];
        let active = false;

        socket.emit('join', streamer);
        console.log("Joined room: " + streamer);

        socket.on('play-tts', (data) => {
            console.log("New message arriving...");
            queue.push(data);
            if (!active) process();
        });

        async function process() {
            if (queue.length === 0) { active = false; return; }
            active = true;

            const current = queue.shift();
            header.innerHTML = `<span class="user">${current.username}</span> sent tts`;
            messageDiv.innerText = current.message;
            
            // Show the text
            container.classList.add('show');

            // The New Brian Voice Source (High quality & stable)
            const brianUrl = `https://api.is-a-good-boy.com/voice/brian?text=${encodeURIComponent(current.message)}`;
            const audio = new Audio(brianUrl);

            // Logic: Wait for audio OR 7 seconds (failsafe)
            const playAudio = new Promise(res => {
                audio.onended = res;
                audio.onerror = (e) => {
                    console.error("Audio failed to play", e);
                    res();
                };
                audio.play().catch(err => {
                    console.log("Autoplay blocked. Right-click source -> Interact -> Click anywhere.");
                    res();
                });
            });

            const waitSeven = new Promise(res => setTimeout(res, 7000));

            // Wait for whichever finishes first, then fade out
            await Promise.race([playAudio, waitSeven]);

            container.classList.remove('show');

            // Wait 1 second for fade-out before next message
            setTimeout(process, 1000);
        }
    </script>
</body>
</html>
