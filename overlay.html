<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            background: transparent; 
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center; 
            align-items: center;     
            text-align: center;
        }

        #container {
            opacity: 0; 
            transition: opacity 0.5s ease-in-out;
            padding: 20px;
            /* Small shadow instead of outline */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
        }

        .header-text { 
            font-size: 20px; /* Smaller header */
            font-weight: 800; 
            color: white; 
            margin-bottom: 4px;
        }

        /* Blue Username */
        .username { color: #3498db; }

        /* Message text - smaller than header */
        .message-text { 
            color: white; 
            font-size: 17px; 
            font-weight: 500;
            max-width: 500px;
            word-wrap: break-word;
            margin: 0 auto;
        }

        .show { opacity: 1 !important; }
    </style>
</head>
<body>
    <div id="container">
        <div id="header" class="header-text"></div>
        <div id="message" class="message-text"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const streamerName = params.get('user')?.toLowerCase() || "ranwolfyt";
        
        const container = document.getElementById('container');
        const header = document.getElementById('header');
        const messageDiv = document.getElementById('message');

        let queue = [];
        let isPlaying = false;

        if (streamerName) {
            socket.emit('join', streamerName);
        }

        socket.on('play-tts', (data) => {
            queue.push(data);
            processQueue();
        });

        async function processQueue() {
            if (isPlaying || queue.length === 0) return;
            isPlaying = true;

            const current = queue.shift();
            
            // Set text content
            header.innerHTML = `<span class="username">${current.username}</span> sent tts`;
            messageDiv.innerText = current.message;

            // Show UI
            container.classList.add('show');

            // Play Brian TTS
            const brianUrl = `https://api.streamelements.com/kappa/v2/speech?voice=Brian&text=${encodeURIComponent(current.message)}`;
            const audio = new Audio(brianUrl);

            // We want to wait for either the audio to finish OR a 7-second timer
            const audioPromise = new Promise((resolve) => {
                audio.onended = resolve;
                audio.onerror = resolve; // If audio fails, move on
                audio.play().catch(resolve); // If autoplay blocked, move on
            });

            const fadeTimer = new Promise((resolve) => setTimeout(resolve, 7000));

            // Wait for audio to finish, but at LEAST wait 7 seconds total for the alert
            await Promise.all([audioPromise, fadeTimer]);

            // Hide UI
            container.classList.remove('show');

            // Small delay before next message starts to allow fade-out
            setTimeout(() => {
                isPlaying = false;
                processQueue();
            }, 600); 
        }
    </script>
</body>
</html>
