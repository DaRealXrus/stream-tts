<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; background: transparent; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center;
        }
        #container {
            opacity: 0; transition: opacity 0.5s ease;
            /* Soft shadow as requested */
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }
        .header { 
            font-size: 22px; font-weight: 900; color: white; margin-bottom: 2px;
        }
        /* Blue Username */
        .user { color: #00a2ff; } 
        
        /* Smaller Message text */
        .msg { 
            color: white; font-size: 18px; font-weight: 500;
            max-width: 500px; margin: 0 auto; line-height: 1.2;
        }
        .active { opacity: 1 !important; }
    </style>
</head>
<body>
    <div id="container">
        <div id="header" class="header"></div>
        <div id="message" class="msg"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const user = params.get('user')?.toLowerCase() || "ranwolfyt";
        
        const container = document.getElementById('container');
        const header = document.getElementById('header');
        const messageDiv = document.getElementById('message');

        let queue = [];
        let isProcessing = false;

        socket.emit('join', user);

        socket.on('play-tts', (data) => {
            queue.push(data);
            if (!isProcessing) next();
        });

        async function next() {
            if (queue.length === 0) { isProcessing = false; return; }
            isProcessing = true;

            const item = queue.shift();
            header.innerHTML = `<span class="user">${item.username}</span> sent tts`;
            messageDiv.innerText = item.message;
            
            container.classList.add('active');

            // Using Streamlabs Brian - usually faster and less "filtered" than SE
            const ttsUrl = `https://streamlabs.com/polly/speak?voice=Brian&text=${encodeURIComponent(item.message)}`;
            const audio = new Audio(ttsUrl);

            // This is the "Unstuckable" logic
            // It waits for EITHER the audio to end OR 7 seconds to pass
            const timerPromise = new Promise(res => setTimeout(res, 7000));
            const audioPromise = new Promise(res => {
                audio.onended = res;
                audio.onerror = res;
                audio.play().catch(res);
            });

            await Promise.race([timerPromise, audioPromise]);

            // Fade out
            container.classList.remove('active');

            // Wait for fade to finish before next message
            setTimeout(next, 800);
        }
    </script>
</body>
</html>
